<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>妙匠工具 - 电脑工具分享站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans SC', system-ui, sans-serif;
        }
        
        .hero-bg {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
        }
        
        .tool-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .tool-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }
        
        .nav-link {
            position: relative;
        }
        
        .nav-link:after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            left: 0;
            background-color: #3b82f6;
            transition: all 0.3s;
        }
        
        .nav-link:hover:after {
            width: 100%;
        }
        
        .wave-bg {
            background: linear-gradient(45deg, #f8fafc, #e0f2fe);
        }
    </style>
</head>
<body class="bg-zinc-50 text-zinc-800">
    <!-- 导航栏 -->
    <nav class="bg-white border-b border-zinc-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-2xl font-bold shadow-lg">妙</div>
                <div>
                    <span class="text-2xl font-bold tracking-tight">妙匠工具</span>
                    <p class="text-xs text-zinc-500 -mt-1">电脑工具分享站</p >
                </div>
            </div>
            
            <div class="hidden md:flex items-center gap-8 text-sm font-medium">
                <a href=" " onclick="navigateTo('home')" class="nav-link text-zinc-700 hover:text-blue-600">首页</a >
                <a href="#" onclick="navigateTo('categories')" class="nav-link text-zinc-700 hover:text-blue-600">分类</a >
                <a href="#" onclick="navigateTo('tools')" class="nav-link text-zinc-700 hover:text-blue-600">所有工具</a >
                <a href="#" onclick="navigateTo('submit')" class="nav-link text-zinc-700 hover:text-blue-600">提交工具</a >
            </div>
            
            <div class="flex items-center gap-4">
                <div class="relative w-72 hidden md:block">
                    <input 
                        id="nav-search"
                        type="text" 
                        占位符="搜索工具..." 
                        class="w-full bg-zinc-100 border border-zinc-300 rounded-full py-2.5 pl-11 pr-4 text-sm focus:outline-none focus:border-blue-500 transition-colors"
                        onkeyup="如果(事件.键 === '回车') 搜索工具(此.值)">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-3 text-zinc-400"></i>
                </div>
                <按钮 onclick="切换暗黑模式()" 
                        类="w-10 h-10 flex items-center justify-center text-zinc-600 hover:text-zinc-900 rounded-xl hover:bg-zinc-100">
                    <i class="fa-solid fa-moon text-lg"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- 英雄 -->
    <header id="home" class="hero-bg text-white py-24 relative overflow-hidden">
        <div class="absolute inset-0 bg-[radial-gradient(at_top_right,#ffffff20_0%,transparent_50%)]"></div>
        <div class="max-w-7xl mx-auto px-6 relative">
            <div class="max-w-2xl">
                <div class="inline-flex items-center gap-2 bg-white/20 backdrop-blur-md px-4 py-1
